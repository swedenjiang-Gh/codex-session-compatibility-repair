name: test-and-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Run source tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone EXE
        shell: pwsh
        run: ./build-exe.ps1 -Python (Get-Command python.exe).Source
      - name: Smoke test standalone EXE
        run: python tests/exe_fixture.py dist/CodexSessionCompatibilityRepair.exe
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexSessionCompatibilityRepair-win-x64
          path: dist/CodexSessionCompatibilityRepair.exe
          if-no-files-found: error

